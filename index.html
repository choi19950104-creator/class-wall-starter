<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리 반 담벼락</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📌</text></svg>">
  <style>
    body { font-family: sans-serif; margin: 20px; }
    h1 { font-size: 24px; }
    .notice { background: #ffe9e9; padding: 10px; }

    /* 로그인 버튼이 들어올 자리 */
    #userArea { margin: 10px 0; color: #666; }

    /* 메모 쓰는 칸 */
    #writer { margin: 16px 0; }
    #writer textarea { width: 400px; font-size: 16px; }

    /* 메모가 붙는 담벼락 */
    #wall { display: flex; flex-wrap: wrap; gap: 10px; }
    .memo { border: 1px solid #ddd; background: #fffde7; padding: 10px; width: 200px; font-size: 15px; }
    .memo button { float: right; }
    .ai-comment { margin: 10px 0 0; padding-top: 8px; border-top: 1px dashed #ccc; color: #355; }
  </style>
</head>
<body>

  <h1>우리 반 담벼락</h1>

  <!-- Firestore에 저장되므로 새로고침해도 메모가 남습니다 -->
  <p class="notice">메모가 저장됩니다. 새로고침해도 작성한 메모가 남아 있습니다.</p>

  <!-- Google 로그인 상태와 로그인·로그아웃 버튼이 들어옵니다 -->
  <div id="userArea">로그인 상태를 확인하고 있습니다.</div>

  <div id="writer">
    <textarea id="input" rows="3" placeholder="Google 로그인 후 메모를 쓸 수 있습니다" disabled></textarea>
  </div>

  <!-- 메모는 app.js가 그립니다 -->
  <div id="wall"></div>

  <!--
    type="module" 로 불러옵니다.
    Firebase SDK가 import 문법이라, 백엔드 시간에 이 방식이어야 붙일 수 있습니다.
  -->
  <script type="module" src="app.js"></script>
</body>
</html>
